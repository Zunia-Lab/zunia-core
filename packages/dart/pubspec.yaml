name: zunia_core
description: Dart bindings for the Zunia wallet kernel. Loads prebuilt native libraries from GitHub Releases; does not require a Rust toolchain at app-build time.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
