[package]
name = "zunia-kernel"
description = "Zunia wallet kernel: BIP-39, BIP-32, SLIP-0010, addresses, keyring envelope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sha2.workspace = true
sha3.workspace = true
ripemd.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
bip39.workspace = true
k256.workspace = true
ed25519-dalek.workspace = true
bech32.workspace = true
hex.workspace = true
base64.workspace = true
bs58.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Routes getrandom to crypto.getRandomValues in the browser. Without this the build fails
# rather than silently using a weak source, which is the behaviour we want.
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
serde_json = { workspace = true }
