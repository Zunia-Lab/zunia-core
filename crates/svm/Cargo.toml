[package]
name = "zunia-svm"
description = "Solana address derivation, message compilation and ed25519 signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Off by default. Solana is not part of the launch scope, and a feature gate keeps it out of the
# WASM bundle that ships to every extension user rather than merely out of the UI.
default = []
solana = []

[dependencies]
zunia-kernel.workspace = true
bs58.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
serde_json.workspace = true
