name: Release

on:
  push:
    branches: [main]
    # A v* tag is what cuts a release: the GitHub Release job below runs only for one.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish @zunialab/core to npm (needs the NPM_TOKEN secret)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  wasm:
    name: Build and publish @zunialab/core
    runs-on: ubuntu-latest
    env:
      # npm publish runs for a dispatch with publish=true, and for a v* tag when the repository
      # has an NPM_TOKEN secret. Anything else builds and uploads the package without publishing.
      # A step's `if` cannot read secrets, hence the flag.
      PUBLISH_NPM: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (startsWith(github.ref, 'refs/tags/v') && secrets.NPM_TOKEN != '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # scripts/build-wasm.sh installs the wasm-bindgen CLI that matches Cargo.lock. wasm-opt is
      # pinned to the binaryen release a local build uses (130) and checked against its sha256:
      # apt's binaryen is another version, and its output would not match a build from the tag.
      - name: Install wasm-opt (binaryen 130)
        env:
          BINARYEN_VERSION: "130"
          BINARYEN_SHA256: 0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc
        run: |
          tarball="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$tarball"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin"
          "$bin/wasm-opt" --version | grep -q "version ${BINARYEN_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Verify
        env:
          ZUNIA_CHAIN_REGISTRY: ${{ github.workspace }}/.registry
        run: |
          # Registry is optional for the release path itself; tests that need it skip.
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Build npm package
        run: |
          ./scripts/build-wasm.sh
          node scripts/smoke-npm.mjs

      # A tag names a version, and Cargo.toml stamps the one the package and kernelVersion()
      # report. Releasing v0.1.2 with a kernel that calls itself 0.1.1 is refused here.
      - name: Check the tag names the version built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built="$(node -p 'require("./packages/npm/package.json").version')"
          if [[ "v$built" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version built ($built)"
            exit 1
          fi

      # A record, not a check: the module embeds the runner's cargo registry path, so these
      # differ from a local build of the same commit (RELEASING.md).
      - name: Record the kernel checksum
        run: |
          {
            echo '```'
            (cd packages/npm && shasum -a 256 zunia_core_bg.wasm zunia_core.js index.js)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish @zunialab/core with provenance
        if: env.PUBLISH_NPM == 'true'
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::publish=true needs the NPM_TOKEN repository secret"
            exit 1
          fi
          npm publish --access public --provenance

      - uses: actions/upload-artifact@v4
        with:
          name: zunialab-core-npm
          path: packages/npm

  native-android:
    name: Native Android libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Build Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: dist/native/android-libs.tar.gz
          if-no-files-found: warn

  native-ios:
    name: Native iOS xcframework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build iOS
        run: ./scripts/build-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios
          path: |
            dist/native/ZuniaCore.xcframework.tar.gz
            dist/native/SHA256SUMS
          if-no-files-found: warn

  release:
    name: GitHub Release and consumer dispatch
    needs: [wasm, native-android, native-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sign and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tgz' \) -exec cp {} release/ \;
          # The npm package as a tarball for offline verification.
          if [[ -d artifacts/zunialab-core-npm ]]; then
            tar -czf release/zunialab-core-npm.tar.gz -C artifacts/zunialab-core-npm .
          fi
          (cd release && shasum -a 256 * > SHA256SUMS)
          # Detached signatures when a release signing key is configured.
          if [[ -n "${{ secrets.RELEASE_GPG_PRIVATE_KEY }}" ]]; then
            echo "${{ secrets.RELEASE_GPG_PRIVATE_KEY }}" | gpg --batch --import
            (cd release && gpg --batch --yes --detach-sign --armor SHA256SUMS)
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false

      # ADR-0005: a kernel bump is a reviewed PR in each consumer, never an invisible update.
      - name: Notify consumer repositories
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for repo in zunia-extension zunia-mobile zunia-dashboard; do
            gh api "repos/Zunia-Lab/$repo/dispatches" \
              -f event_type=zunia-core-released \
              -F "client_payload[version]=$VERSION" \
              -F "client_payload[tag]=$GITHUB_REF_NAME" \
              || echo "dispatch to $repo failed; open the bump PR by hand"
          done
